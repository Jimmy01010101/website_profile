services:
  db:
    image: mariadb:11
    container_name: smkn1_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: smkn1_wp
      MARIADB_USER: wpuser
      MARIADB_PASSWORD: wppass123
      MARIADB_ROOT_PASSWORD: rootpass123
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    container_name: smkn1_wp
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: smkn1_wp
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass123
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FS_METHOD', 'direct');
    volumes:
      - ./wp-content:/var/www/html/wp-content

  wpcli:
    image: wordpress:cli-php8.3
    container_name: smkn1_cli
    depends_on: [db, wordpress]
    user: "33:33"
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: smkn1_wp
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass123
    volumes:
      - ./wp-content:/var/www/html/wp-content

  phpmyadmin:
    image: phpmyadmin
    container_name: smkn1_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

volumes:
  db_data:
